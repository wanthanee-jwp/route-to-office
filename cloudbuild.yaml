# Cloud Build pipeline: build image, push to Artifact Registry, deploy to Cloud Run.
#
# Trigger it manually:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_SERVICE=route-to-office-staging,_SECRET_NAME=route-to-office-staging,_RUNTIME_SA=route-to-office@$PROJECT_ID.iam.gserviceaccount.com,_FRONTEND_ORIGINS=https://staging.example.com
#
# Or wire it to a GitHub trigger and let Cloud Build fire on push to main.
#
# One-time setup per project:
#   gcloud artifacts repositories create route-to-office --repository-format=docker --location=$_REGION
#   gcloud iam service-accounts create route-to-office --display-name="Route to Office runtime"
#   gcloud secrets add-iam-policy-binding $_SECRET_NAME \
#     --member=serviceAccount:route-to-office@$PROJECT_ID.iam.gserviceaccount.com \
#     --role=roles/secretmanager.secretAccessor

substitutions:
  _REGION: asia-southeast1
  _REPO: route-to-office
  _SERVICE: route-to-office-staging
  _SECRET_NAME: route-to-office-staging
  _RUNTIME_SA: '' # e.g. route-to-office@PROJECT_ID.iam.gserviceaccount.com
  _FRONTEND_ORIGINS: '' # e.g. https://route.example.com

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=1
      - --cpu=1
      - --memory=512Mi
      - --port=8080
      - --timeout=30s
      - --set-env-vars=USE_GCP_SECRETS=true,GCP_SECRET_NAME=${_SECRET_NAME},TZ=Asia/Bangkok,FRONTEND_ORIGINS=${_FRONTEND_ORIGINS}

options:
  logging: CLOUD_LOGGING_ONLY

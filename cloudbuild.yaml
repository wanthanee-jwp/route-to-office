# Cloud Build pipeline: BUILD + DEPLOY.
#
# Fires on git tag push (e.g. v1.0.0 or staging-2026-09-20). Also runnable
# manually via `gcloud builds submit --config cloudbuild.yaml --substitutions=...`.
#
# Image is tagged with $TAG_NAME so every deploy is traceable to a git tag.
#
# One-time setup per project:
#   gcloud artifacts repositories create route-to-office --repository-format=docker --location=$_REGION
#   gcloud iam service-accounts create route-to-office --display-name="Route to Office runtime"
#   gcloud secrets add-iam-policy-binding $_SECRET_NAME \
#     --member=serviceAccount:route-to-office@$PROJECT_ID.iam.gserviceaccount.com \
#     --role=roles/secretmanager.secretAccessor

substitutions:
  _REGION: asia-southeast1
  _REPO: route-to-office
  _SERVICE: route-to-office-staging
  _SECRET_NAME: route-to-office-staging
  _RUNTIME_SA: '' # e.g. route-to-office@PROJECT_ID.iam.gserviceaccount.com
  _FRONTEND_ORIGINS: '' # e.g. https://route.example.com

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${TAG_NAME}'

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${TAG_NAME}'
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${TAG_NAME}'

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${TAG_NAME}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=1
      - --cpu=1
      - --memory=512Mi
      - --port=8080
      - --timeout=30s
      - --set-env-vars=USE_GCP_SECRETS=true,GCP_PROJECT_ID=$PROJECT_ID,GCP_SECRET_NAME=${_SECRET_NAME},TZ=Asia/Bangkok,FRONTEND_ORIGINS=${_FRONTEND_ORIGINS}

options:
  logging: CLOUD_LOGGING_ONLY
